<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Django MCP{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0f1117;
            color: #e1e4e8;
            line-height: 1.6;
            min-height: 100vh;
        }
        .mcp-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 32px 24px;
        }
        h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        h2 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
        h3 { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        p { margin-bottom: 12px; color: #8b949e; font-size: 14px; }
        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 13px;
        }
        pre {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 12px;
            overflow-x: auto;
            font-size: 13px;
            color: #c9d1d9;
        }
        table { width: 100%; border-collapse: collapse; }
        th {
            text-align: left;
            padding: 10px 12px;
            border-bottom: 2px solid #30363d;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8b949e;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }
        tr:hover td { background: #161b22; }
        .btn {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            border: 1px solid transparent;
            cursor: pointer;
            text-decoration: none;
        }
        .btn-primary { background: #238636; color: #fff; border-color: #2ea043; }
        .btn-primary:hover { background: #2ea043; text-decoration: none; }
        .btn-danger { background: transparent; color: #f85149; border-color: #f85149; }
        .btn-danger:hover { background: #da3633; color: #fff; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        input[type="text"], input[type="password"] {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 6px 12px;
            color: #c9d1d9;
            font-size: 14px;
            outline: none;
        }
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.15);
        }
        .alert {
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }
        .alert-success { background: #0d2818; border: 1px solid #238636; }
        .alert-success h3 { color: #3fb950; }
        .alert-success p { color: #8bdea6; }
        .alert-error { background: #2d1117; border: 1px solid #da3633; color: #f85149; }
        .field-label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: #8b949e;
            margin-bottom: 4px;
        }
        .field-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .field-row code {
            flex: 1;
            background: #161b22;
            padding: 8px 12px;
            border-radius: 4px;
            word-break: break-all;
        }
        .field-row .btn-copy {
            flex-shrink: 0;
        }
        .section { margin-bottom: 32px; }
        .section-divider {
            border: none;
            border-top: 1px solid #30363d;
            margin: 24px 0;
        }
        .inline-form { display: inline; }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .status-active { color: #3fb950; }
        .status-inactive { color: #8b949e; }
        .empty-state {
            text-align: center;
            padding: 32px;
            color: #484f58;
        }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="mcp-container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
